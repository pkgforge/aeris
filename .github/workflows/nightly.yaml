name: aeris nightly
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

on:
  push:
    tags:
      - nightly
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  remove-nightly-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Remove existing nightly tag
        run: |
          gh release delete nightly --cleanup-tag || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-nightly:
    name: Publish nightly binaries
    needs: remove-nightly-tag
    runs-on: ${{ matrix.build.RUNNER }}
    container:
      image: ${{ matrix.build.IMAGE }}
    strategy:
      fail-fast: false
      matrix:
        build:
          - {
              NAME: x86_64-linux,
              ARCH: x86_64,
              RUNNER: ubuntu-latest,
              IMAGE: "archlinux:latest",
              ONELF: onelf-x86_64-linux,
              VULKAN_DRIVERS: "vulkan-swrast vulkan-radeon vulkan-intel vulkan-nouveau",
              DEBLOATED: "llvm-libs-nano mesa-nano vulkan-radeon-nano vulkan-intel-nano vulkan-nouveau-nano libxml2-iculess",
              PKG_EXT: "pkg.tar.zst",
            }
          - {
              NAME: aarch64-linux,
              ARCH: aarch64,
              RUNNER: ubuntu-24.04-arm,
              IMAGE: "menci/archlinuxarm:latest",
              ONELF: onelf-aarch64-linux,
              VULKAN_DRIVERS: "vulkan-swrast vulkan-radeon vulkan-nouveau vulkan-panfrost vulkan-broadcom",
              DEBLOATED: "llvm-libs-nano mesa-nano vulkan-radeon-nano vulkan-nouveau-nano vulkan-panfrost-nano vulkan-broadcom-nano libxml2-iculess",
              PKG_EXT: "pkg.tar.xz",
            }
    steps:
      - name: Install dependencies
        shell: bash
        run: |
          pacman -Syu --disable-sandbox --noconfirm --needed \
            base-devel git curl tar xz b3sum rust patchelf pkgconf \
            libxcb libxkbcommon libxkbcommon-x11 \
            wayland mesa vulkan-icd-loader \
            ${{ matrix.build.VULKAN_DRIVERS }}

      - name: Checkout
        uses: actions/checkout@v5

      - name: Get version info
        id: version
        shell: bash
        run: |
          # Not `git rev-parse`: the workspace is checked out by the runner
          # and this step runs as root inside the container, so git refuses it
          # as dubiously owned and the name collapses to a bare "nightly-".
          echo "version=nightly-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: cargo build --release --locked --jobs "$(($(nproc)+1))"

      - name: Create tarball
        shell: bash
        run: |
          mkdir -p release
          cp LICENSE README.md release/
          cp target/release/aeris release/
          tar -cJf "aeris-${{ matrix.build.NAME }}.tar.xz" release/
          b3sum "aeris-${{ matrix.build.NAME }}.tar.xz" \
            > "aeris-${{ matrix.build.NAME }}.tar.xz.b3sum"

      # The graphics stack is most of what gets bundled, and llvm-libs alone is
      # over half of it. These are the same packages without the parts a
      # bundled renderer never reaches for, and they install under the stock
      # names, so onelf picks them up unchanged.
      #
      # After the build, not before: rustc links the system libLLVM, and the
      # slimmed one drops targets it needs.
      - name: Slim the graphics stack
        shell: bash
        run: |
          base="https://github.com/pkgforge-dev/archlinux-pkgs-debloated/releases/download/continuous"
          mkdir -p /tmp/debloated
          cd /tmp/debloated
          for pkg in ${{ matrix.build.DEBLOATED }}; do
            curl -fsSL -O "$base/${pkg}-${{ matrix.build.ARCH }}.${{ matrix.build.PKG_EXT }}"
          done
          pacman -U --disable-sandbox --noconfirm ./*.${{ matrix.build.PKG_EXT }}

      - name: Fetch onelf
        shell: bash
        run: |
          curl -fsSL -o onelf \
            "https://github.com/QaidVoid/onelf/releases/latest/download/${{ matrix.build.ONELF }}"
          chmod +x onelf

      - name: Pack with onelf
        shell: bash
        run: |
          mkdir -p AppDir/bin
          cp target/release/aeris AppDir/bin/aeris
          cp onelf.toml AppDir/onelf.toml
          sed -i "s/^version = .*/version = \"${{ steps.version.outputs.version }}\"/" AppDir/onelf.toml
          ./onelf build AppDir
          mv AppDir/aeris.onelf "aeris-${{ matrix.build.NAME }}.onelf"
          b3sum "aeris-${{ matrix.build.NAME }}.onelf" > "aeris-${{ matrix.build.NAME }}.onelf.b3sum"

      - name: Verify pack
        run: ./onelf verify "aeris-${{ matrix.build.NAME }}.onelf"

      - name: Publish to GitHub (nightly)
        if: ${{ !env.ACT }}
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: aeris-${{ matrix.build.NAME }}*
          file_glob: true
          overwrite: true
          tag: nightly
          release_name: "${{ steps.version.outputs.version }}"
          prerelease: true

      - name: Attest build provenance
        if: ${{ !env.ACT }}
        uses: actions/attest-build-provenance@v3.0.0
        with:
          subject-path: |
            aeris-${{ matrix.build.NAME }}.tar.xz
            aeris-${{ matrix.build.NAME }}.onelf
          show-summary: true
